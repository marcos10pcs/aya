<!doctype html>
<html lang="en-US" class="bg-white dark:bg-neutral-900">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="icon" href="./img/aya.png" />
        <title>Aya</title>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://fonts.cdnfonts.com" />
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet" />
        <link href="https://fonts.cdnfonts.com/css/chomsky" rel="stylesheet" />
        <link href="https://fonts.cdnfonts.com/css/code-new-roman" rel="stylesheet" />

        <!-- Scripts -->
        <script type="module" src="./main.js"></script>
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
                    document.documentElement.setAttribute("data-mode", "dark");
                } else {
                    document.documentElement.setAttribute("data-mode", "light");
                }
            });
        </script>
    </head>
    <body class="font-sans antialiased">
        <div id="app"></div>
    </body>
</html>
